[project]
name = "permissioned-agent-sandbox"
version = "0.1.0"
description = "A security-focused sandbox for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "groq>=1.7.0",
    "langgraph>=1.2.11",
]
[tool.pytest.ini_options]
pythonpath = ["."]
